<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Underdepress 的有趣小站</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    min-height: 100vh;
    font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    color: #e0e0e0;
    padding: 40px 20px;
  }

  .container { max-width: 900px; margin: 0 auto; }

  header {
    text-align: center;
    margin-bottom: 48px;
  }
  header h1 {
    font-size: 48px;
    background: linear-gradient(90deg, #4eff4e, #00c9ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 8px;
  }
  header p { color: #888; font-size: 16px; }

  .app-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 24px;
  }

  .app-card {
    background: linear-gradient(145deg, #1e1e3a, #25254a);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 28px 24px;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    text-decoration: none;
    color: inherit;
    display: block;
  }
  .app-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0,0,0,0.5), 0 0 30px rgba(78,255,78,0.1);
    border-color: rgba(78,255,78,0.3);
  }

  .app-icon { font-size: 48px; margin-bottom: 16px; }
  .app-card h3 { font-size: 22px; margin-bottom: 8px; color: #fff; }
  .app-card p { font-size: 14px; color: #aaa; line-height: 1.6; }
  .app-card .tag {
    display: inline-block;
    background: rgba(78,255,78,0.15);
    color: #4eff4e;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    margin-top: 14px;
  }

  .empty-slot {
    background: rgba(255,255,255,0.03);
    border: 2px dashed rgba(255,255,255,0.1);
    border-radius: 18px;
    padding: 28px 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 180px;
    color: #555;
    text-align: center;
  }
  .empty-slot .plus { font-size: 40px; margin-bottom: 8px; }

  footer {
    text-align: center;
    margin-top: 60px;
    color: #555;
    font-size: 13px;
  }

  @media (max-width: 600px) {
    header h1 { font-size: 34px; }
    .app-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>Underdepress 的有趣小站</h1>
    <p>一些好玩的网页小应用，没事来逛逛</p>
  </header>

  <div class="app-grid">
    <a href="snake-game.html" class="app-card">
      <div class="app-icon">🐍</div>
      <h3>贪吃蛇</h3>
      <p>经典贪吃蛇游戏。区域随蛇身变长不断扩大，支持排行榜、背景音乐和触屏操作。</p>
      <span class="tag">游戏</span>
    </a>

    <div class="empty-slot">
      <div class="plus">＋</div>
      <div>更多应用即将到来</div>
    </div>
  </div>

  <footer>Underdepress 的有趣小站</footer>
</div>

</body>
</html>
